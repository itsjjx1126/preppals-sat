<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Email Verified – PrepPals</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f7f7fb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      background:#fff;
      border-radius:24px;
      padding:64px 48px;
      width:100%;
      max-width:520px;
      text-align:center;
      box-shadow:0 4px 24px rgba(0,0,0,0.08);
    }
    .icon{font-size:80px;margin-bottom:24px}
    .logo{
      font-size:26px;
      font-weight:800;
      margin-bottom:36px;
      letter-spacing:-0.5px;
      background:linear-gradient(130deg,#1B2D6B 0%,#E8237A 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      display:inline-block;
    }
    h1{font-size:30px;font-weight:700;color:#1a1a2e;margin-bottom:14px}
    p{font-size:16px;color:#666;line-height:1.6;max-width:360px;margin:0 auto}

    @media(max-width:480px){
      .card{padding:48px 28px}
      h1{font-size:24px}
      .icon{font-size:64px}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PrepPals</div>
    <div class="icon">✅</div>
    <h1>Email Verified!</h1>
    <p>Your account has been successfully verified. Head back to the PrepPals app and sign in to get started.</p>
  </div>
</body>
</html>
