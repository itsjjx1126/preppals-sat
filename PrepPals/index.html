<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content"/>
<title>PrepPals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════════
   PrepPals FINAL — Design System
   Brand gradient: Deep Navy #1B2D6B → Hot Pink #E8237A
   English / Reading  → BLUE  (#1B2D6B, #2B47D9)
   Math               → PINK  (#E8237A, #FF4FA3)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --navy:#1B2D6B; --navy2:#2B47D9; --navy-s:#EBF0FF; --navy-b:#C5D0F5;
  --pink:#E8237A; --pink2:#FF4FA3; --pink-s:#FFEBF4; --pink-b:#F7A8CF;
  --bg:#F4F5FA; --card:#FFFFFF; --card2:#F8F9FD;
  --text:#111827; --t2:#4B5563; --t3:#9CA3AF;
  --bdr:#E5E7EB; --bdr2:#D1D5DB;
  --sh:0 2px 12px rgba(0,0,0,.07); --sh2:0 8px 32px rgba(0,0,0,.13);
  --match:#22C55E; --match-s:#DCFCE7;
  --danger:#EF4444; --danger-s:#FEF2F2;
  --r:18px; --r2:13px; --r3:9px;
  --font:'DM Sans',sans-serif; --serif:'DM Serif Display',serif;
  --safe:env(safe-area-inset-bottom,0px);
}
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0C1024}
#root{height:100%;display:flex;justify-content:center;align-items:center;
  background:linear-gradient(145deg,#080D1A 0%,#1B2D6B 40%,#6B0E3D 72%,#E8237A 100%)}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
  box-shadow:0 0 0 10px #060A15,0 0 0 12px #111827,0 40px 100px rgba(0,0,0,.65);
  display:flex;flex-direction:column;position:relative}

/* STATUS BAR */
.sb{height:54px;background:var(--bg);display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 28px 8px;flex-shrink:0;z-index:20;position:relative}
.sb-t{font-size:15px;font-weight:600;letter-spacing:-.3px}
.sb-i{display:flex;gap:5px;align-items:center}
.sb-i svg{width:15px;height:15px;fill:var(--text)}

/* NAV */
.nav{background:rgba(244,245,250,.96);backdrop-filter:blur(24px);
  border-top:1px solid var(--bdr);display:flex;align-items:stretch;
  padding:0 8px calc(var(--safe) + 4px);flex-shrink:0;z-index:20;position:relative}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 4px;cursor:pointer;font-size:10.5px;font-weight:500;
  color:var(--t3);border:none;background:none;transition:color .2s}
.nb.on{color:var(--navy2)}
.nb svg{width:23px;height:23px;stroke-width:1.8;fill:none;stroke:currentColor}
.nb.on svg{stroke:var(--navy2)}
.scr{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* ── AUTH ── */
.aw{flex:1;overflow-y:auto;padding:28px 22px 0;display:flex;flex-direction:column;min-height:0}
.logo{font-family:var(--serif);font-size:40px;letter-spacing:-1px}
.logo-g{background:linear-gradient(130deg,var(--navy) 0%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{font-size:13px;color:var(--t2);margin:4px 0 20px;line-height:1.5}
.lbl{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px;display:block}
.inp{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--bdr);
  background:var(--card);font-size:14px;font-family:var(--font);color:var(--text);
  outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--navy2)}
.inp-err{border-color:#ef4444!important}
.ig{margin-bottom:11px}
.btn-p{width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(130deg,var(--navy2) 0%,var(--pink) 100%);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  font-family:var(--font);transition:opacity .15s;margin-top:5px}
.btn-p:disabled{opacity:.4;cursor:default}
.btn-p:active{opacity:.82}
.asw{text-align:center;margin-top:11px;font-size:13px;color:var(--t2)}
.asw button{background:none;border:none;color:var(--navy2);font-weight:600;
  cursor:pointer;font-family:var(--font);font-size:13px}
.email-warn{font-size:11px;color:var(--t2);margin-top:6px;line-height:1.5}
.support-link{color:#3b82f6;text-decoration:none;font-weight:500}
.support-link:hover{text-decoration:underline}
.aerr{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:10px;
  padding:9px 13px;font-size:12.5px;color:var(--danger);margin-bottom:10px}

/* CONSENT CHECKBOXES */
.con-block{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.con-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;
  background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;cursor:pointer}
.con-row.ck{border-color:var(--match)}
.con-box{width:19px;height:19px;border-radius:5px;border:2px solid var(--bdr2);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  background:#fff;transition:all .15s}
.con-row.ck .con-box{background:var(--match);border-color:var(--match)}
.con-box svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;opacity:0}
.con-row.ck .con-box svg{opacity:1}
.con-txt{font-size:12px;color:var(--t2);line-height:1.5}
.con-txt strong{color:var(--text);font-weight:500}

/* VERIFY GATE */
.vgate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:28px 22px}
.vgate-icon{font-size:52px;margin-bottom:14px}
.vgate h2{font-size:21px;font-weight:600;margin-bottom:10px}
.vgate-box{background:var(--navy-s);border:1.5px solid var(--navy-b);border-radius:12px;
  padding:14px;font-size:13px;color:var(--navy);line-height:1.6;text-align:left;margin-bottom:14px}
.vgate p{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:18px}

/* ONBOARD */
.ob{flex:1;overflow-y:auto;padding:18px 20px;min-height:0}
.ob-step{font-size:10.5px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.ob-title{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:3px 0 4px}
.ob-sub{font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.5}
.back-t{width:100%;padding:10px;border:none;background:none;color:var(--t2);
  font-size:13px;cursor:pointer;margin-top:5px;font-family:var(--font)}

/* AVATAR GRID */
.av-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;width:100%}
.av-opt{border-radius:14px;border:2.5px solid var(--bdr);background:var(--card);
  padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:all .18s}
.av-opt.on{border-color:var(--navy2);background:var(--navy-s)}
.av-opt img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--bdr)}
.av-opt span{font-size:11px;font-weight:500;color:var(--t2)}
.av-opt.on span{color:var(--navy2)}

/* GRADE STEPPER */
.grade-step{display:flex;align-items:center;gap:13px;margin-top:3px}
.step-btn{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--bdr);
  background:var(--card);font-size:20px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-weight:300;color:var(--text);transition:all .15s}
.step-btn:disabled{opacity:.35;cursor:default}
.step-btn:active{background:var(--bdr)}
.grade-val{font-size:19px;font-weight:600;min-width:38px;text-align:center}

/* SLIDERS — blue/pink themed */
.sl-g{margin-bottom:15px}
.sl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sl-lbl{font-size:13px;font-weight:500;color:var(--t2)}
.sl-v-b{font-size:13.5px;font-weight:700;color:var(--navy2);background:var(--navy-s);
  padding:2px 11px;border-radius:20px}
.sl-v-p{font-size:13.5px;font-weight:700;color:var(--pink);background:var(--pink-s);
  padding:2px 11px;border-radius:20px}
.sl-marks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:3px}

/* Blue slider */
input[type=range].sl-b{width:100%;-webkit-appearance:none;appearance:none;
  height:5px;border-radius:3px;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--navy2) 0%,var(--navy2) var(--pct,50%),var(--bdr2) var(--pct,50%),var(--bdr2) 100%)}
input[type=range].sl-b::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--navy2);box-shadow:0 2px 8px rgba(43,71,217,.35);cursor:pointer}
input[type=range].sl-b::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
  background:var(--navy2);border:none;cursor:pointer}

/* Pink slider */
input[type=range].sl-p{width:100%;-webkit-appearance:none;appearance:none;
  height:5px;border-radius:3px;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--pink) 0%,var(--pink) var(--pct,50%),var(--bdr2) var(--pct,50%),var(--bdr2) 100%)}
input[type=range].sl-p::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--pink);box-shadow:0 2px 8px rgba(232,35,122,.35);cursor:pointer}
input[type=range].sl-p::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
  background:var(--pink);border:none;cursor:pointer}

/* CHIP GRID */
.chip-g{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;width:100%}
.chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--card);
  font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;font-family:var(--font);transition:all .14s}
.chip.on{border-color:var(--navy2);background:var(--navy-s);color:var(--navy2)}

/* SAT UPLOAD */
.up-z{border:2px dashed var(--bdr2);border-radius:12px;padding:18px;text-align:center;
  cursor:pointer;transition:all .2s;position:relative;margin-top:4px}
.up-z:hover,.up-z.drag{border-color:var(--navy2);background:var(--navy-s)}
.up-z input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.up-z svg{width:32px;height:32px;stroke:var(--t3);stroke-width:1.5;fill:none;margin:0 auto 7px;display:block}
.up-z p{font-size:13.5px;font-weight:500;color:var(--t2)}
.up-z small{font-size:11.5px;color:var(--t3)}
.up-err{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:9px;padding:9px 13px;font-size:12.5px;color:var(--danger);margin-bottom:8px}
.up-ok{background:var(--match-s);border:1px solid var(--match);border-radius:9px;padding:9px 13px;font-size:12.5px;color:#166534;margin-bottom:8px}
.up-proc{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--navy-s);border-radius:9px;font-size:12.5px;color:var(--navy2);margin-bottom:8px}
.up-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.up-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--match-s);border-radius:9px}
.up-item-ico{width:24px;height:24px;border-radius:50%;background:var(--match);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.up-item-ico svg{width:13px;height:13px;stroke:#fff;stroke-width:2.5;fill:none}
.up-item-nm{font-size:12.5px;font-weight:500;color:var(--text)}
.up-item-sc{font-size:11.5px;color:var(--t2)}

/* DISCOVER SCREEN */
.dh{padding:13px 18px 9px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-logo{font-family:var(--serif);font-size:24px;letter-spacing:-.5px}
.app-logo span{background:linear-gradient(130deg,var(--navy) 0%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.icon-btn{width:37px;height:37px;border-radius:50%;background:var(--card);
  border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .14s}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:var(--t2);stroke-width:1.8}

/* CATEGORY TABS */
.cat-tabs{display:flex;gap:8px;padding:0 18px 9px;flex-shrink:0}
.ct{flex:1;padding:9px 0;border-radius:11px;border:1.5px solid var(--bdr);
  background:var(--card);font-size:13.5px;font-weight:600;
  color:var(--t2);cursor:pointer;text-align:center;font-family:var(--font);transition:all .17s}
.ct.blue-on{border-color:var(--navy2);background:var(--navy-s);color:var(--navy2)}
.ct.pink-on{border-color:var(--pink);background:var(--pink-s);color:var(--pink)}
.rt-row{display:flex;align-items:center;gap:5px;padding:0 18px 7px;font-size:11px;color:var(--t3);flex-shrink:0}
.rt-dot{width:6px;height:6px;border-radius:50%;background:var(--match);flex-shrink:0}
.rt-dot.off{background:var(--danger)}

/* CARD STACK */
.disc-search-row{display:flex;align-items:center;gap:8px;padding:0 16px;margin-bottom:8px}
.disc-search{flex:1;padding:9px 14px;border-radius:50px;border:1.5px solid var(--bdr);background:var(--card);font-size:13px;color:var(--tx);outline:none}
.disc-search:focus{border-color:var(--navy2)}
.bk-filter-btn{padding:8px 14px;border-radius:50px;border:1.5px solid var(--bdr);background:var(--card);font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .2s}
.bk-filter-btn.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.card-stack{flex:1;position:relative;overflow:hidden;margin:0 16px;min-height:0}
.cslot{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.pcard{width:100%;height:100%;background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--sh2);transition:transform .3s cubic-bezier(.22,.68,0,1.2),opacity .3s;position:relative;z-index:2;display:flex;flex-direction:column}
.pcard.behind{position:absolute;top:50%;left:50%;transform:translate(-50%,calc(-50% + 6px)) scale(.97);z-index:1;pointer-events:none;width:100%}
.pcard.skip-anim{transform:translateX(-120%) rotate(-15deg)!important;opacity:0!important}
.pcard.heart-anim{transform:translateX(120%) rotate(15deg)!important;opacity:0!important}

/* CARD AVATAR AREA */
.cav-area{flex:1;min-height:0;position:relative;overflow:hidden}
.cav-area img{width:100%;height:100%;object-fit:cover}
.cav-init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:68px;color:rgba(255,255,255,.4)}
.c-grade{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);border-radius:18px;
  padding:4px 10px;font-size:11.5px;font-weight:500;color:#fff}
.c-sbadge{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-radius:24px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--text)}
.c-bk{position:absolute;bottom:10px;right:11px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.9);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.c-bk svg{width:15px;height:15px;stroke:var(--t2);stroke-width:2;fill:none;transition:all .14s}
.c-bk.on svg{stroke:var(--pink);fill:var(--pink)}

/* STAMPS */
.stamp{position:absolute;top:35px;border-radius:8px;padding:3px 11px;
  font-size:20px;font-weight:700;text-transform:uppercase;
  opacity:0;transition:opacity .14s;pointer-events:none;z-index:10}
.stamp-like{left:16px;border:3px solid var(--match);color:var(--match);transform:rotate(-18deg)}
.stamp-pass{right:16px;border:3px solid var(--danger);color:var(--danger);transform:rotate(18deg)}

/* CARD BODY */
.cbody{padding:13px 15px 15px}
.cname{font-size:20px;font-weight:600;letter-spacing:-.4px;margin-bottom:3px}
.cbio{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score-pills{display:flex;gap:7px;margin-bottom:9px}
.spill{flex:1;padding:7px 9px;border-radius:10px;text-align:center}
.spill-lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.spill-val{font-size:15px;font-weight:700}
.spill.blue{background:var(--navy-s);color:var(--navy2)}
.spill.blue .spill-lbl{color:var(--navy2)}
.spill.pink{background:var(--pink-s);color:var(--pink)}
.spill.pink .spill-lbl{color:var(--pink)}
.spill.nosat{background:var(--card2);color:var(--t3);flex:1.6}
.spill.nosat .spill-val{font-size:11px;line-height:1.4;font-weight:500}
.tag-row{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:14px;
  display:flex;align-items:center;gap:3px}
.tag svg{width:10px;height:10px;stroke-width:2.2;stroke:currentColor;fill:none}
.tag.str{background:#DCFCE7;color:#166534}
.tag.wk{background:#FEF9C3;color:#854D0E}

/* ACTION ROW */
.act-row{display:flex;gap:11px;justify-content:center;padding:0 16px 13px;flex-shrink:0}
.act-btn{border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--sh);transition:all .14s;flex-shrink:0}
.act-btn:active{transform:scale(.90)}
.btn-skip{width:58px;height:58px;background:var(--card)}
.btn-skip svg{width:26px;height:26px;stroke:#999;stroke-width:2;fill:none}
.btn-more{width:44px;height:44px;background:var(--card)}
.btn-more svg{width:18px;height:18px;stroke:var(--t2);stroke-width:2;fill:none}
.btn-hrt{width:58px;height:58px;background:linear-gradient(135deg,var(--navy2),var(--pink))}
.btn-hrt svg{width:26px;height:26px;fill:#fff;stroke:none}

/* EMPTY / LOADING */
.empty-s{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 26px;text-align:center;gap:9px}
.empty-s svg{width:50px;height:50px;stroke:var(--t3);stroke-width:1.2;fill:none}
.empty-s h3{font-size:18px;font-weight:600;color:var(--text)}
.empty-s p{font-size:13px;color:var(--t2);line-height:1.6}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.4s ease infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.loading-s{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:26px;height:26px;border:2.5px solid var(--bdr);
  border-top-color:var(--navy2);border-radius:50%;animation:spin .72s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-s p{font-size:13px;color:var(--t2)}

/* MATCHES LIST */
.mhdr{padding:13px 18px 9px;flex-shrink:0}
.mhdr-top{display:flex;justify-content:space-between;align-items:baseline}
.mhdr-title{font-size:19px;font-weight:600;letter-spacing:-.4px}
.mhdr-ct{font-size:11.5px;color:var(--t3)}
.m-subtabs{display:flex;gap:6px;padding:0 16px 9px;flex-shrink:0}
.mst{flex:1;padding:7px 0;border-radius:9px;border:1.5px solid var(--bdr);
  background:var(--card);font-size:12.5px;font-weight:600;color:var(--t2);
  cursor:pointer;text-align:center;font-family:var(--font);transition:all .15s}
.mst.on{border-color:var(--navy2);background:var(--navy-s);color:var(--navy2)}
.mst.arch-on{border-color:var(--t3);background:var(--card2);color:var(--t2)}
.mlist{flex:1;overflow-y:auto;padding:0 14px 12px;min-height:0}
.mrow{display:flex;align-items:center;gap:11px;padding:10px 5px;
  border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .13s;border-radius:9px}
.mrow:active{background:var(--card2)}

.toast{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);

@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(7px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── ROTATE SCREEN OVERLAY */
#rotate-overlay{
  display:none;

}

  width:64px;height:64px;stroke:#fff;stroke-width:1.5;fill:none;

}
@keyframes rotateHint{

  100%{transform:rotate(0deg);}

   iPad Pro 11":     834px landscape height
   iPad Pro 12.9/13": 1024–1032px landscape height

const $  = id => document.getElementById(id);
const esc = s => s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(msg,dur=2200){const c=$('tslot');if(!c)return;const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),dur);}
function updateClock(){const e=$('stime');if(e)e.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function relTime(iso){if(!iso)return'';const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);if(m<1)return'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';}
function shortTime(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const msgDay=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diffDays=Math.round((today-msgDay)/(1000*60*60*24));
  const time=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(diffDays===0)return time;
  if(diffDays===1)return 'Yesterday '+time;
  if(diffDays<7)return d.toLocaleDateString([],{weekday:'short'})+' '+time;
  return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+time;
}
function initials(p){if(!p)return'?';return((p.first_name||'').charAt(0)+(p.last_initial||'')).toUpperCase();}
function cardBg(id){const h=(id||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);const g=['linear-gradient(135deg,#1B2D6B,#E8237A)','linear-gradient(135deg,#2B47D9,#7B1147)','linear-gradient(135deg,#7B1147,#FF4FA3)','linear-gradient(135deg,#1B2D6B,#2B47D9)','linear-gradient(135deg,#E8237A,#1B2D6B)','linear-gradient(135deg,#22C55E,#1B2D6B)'];return g[h%g.length];}
function pct(v,mn,mx){return((Math.max(mn,Math.min(mx,v))-mn)/(mx-mn)*100).toFixed(1)+'%';}
function setSlidePct(el){el.style.setProperty('--pct',pct(parseFloat(el.value),parseFloat(el.min),parseFloat(el.max)));}
function scrollChat(){setTimeout(()=>{const e=$('cmsgs');if(e)e.scrollTop=e.scrollHeight;},45);}
function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('Read failed'));r.readAsDataURL(file);});}

/* ── REALTIME */
function subMatches(){
  if(!S.session||S.matchCh)return;
  const uid=S.session.user.id;
  S.matchCh=sb.channel('mc:'+uid)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'matches'},async pl=>{
      const m=pl.new;
      if(m.user_one!==uid&&m.user_two!==uid)return;
      const pid=m.user_one===uid?m.user_two:m.user_one;
      const{data:pt}=await sb.from('profiles').select('*').eq('id',pid).single();
      if(pt){S.matchQueue.push({match:m,partner:pt});if(!S.showMM)nextMatch();}
      // fire match email notification
      // Send match email notification if user has notifications enabled
      try{
        if(S.profile?.email_notifications_enabled){
          const partnerEmail=pt?.email;
          // Notify current user
          await fetch('https://api.resend.com/emails',{method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+RESEND_KEY},
            body:JSON.stringify({
              from:'PrepPals <noreply@preppals.app>',
              to:[S.session.user.email],
              subject:"You've got a new study match! 🎉",
              html:`<h2>You matched with ${esc(pt.first_name)} ${esc(pt.last_initial)}!</h2><p>Head back to <a href="https://preppals.app">PrepPals</a> to start chatting.</p>`
            })
          });
        }
      }catch(_){}
    })
    .subscribe(st=>{S.rtConn=st==='SUBSCRIBED';render();});


}
function nextMatch(){if(!S.matchQueue.length)return;const{partner}=S.matchQueue.shift();S.pendingPt=partner;S.showMM=true;render();}

function subChat(matchId){
  if(S.chatCh){sb.removeChannel(S.chatCh);S.chatCh=null;}
  S.chatCh=sb.channel('ch:'+matchId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`match_id=eq.${matchId}`},pl=>{
      const m=pl.new;const idx=S.chatMsgs.findIndex(x=>x.id===m.id);
      if(idx>-1){S.chatMsgs[idx]=m;render();}
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`match_id=eq.${matchId}`},pl=>{
      const m=pl.new;if(!S.chatMsgs.find(x=>x.id===m.id)){S.chatMsgs.push(m);render();scrollChat();}
      // If we're the recipient and chat is open, mark as read immediately
      const uid2=S.session?.user?.id;
      if(m.sender_id!==uid2&&S.openChat?.matchId===matchId){
        sb.from('messages').update({read_at:new Date().toISOString()}).eq('id',m.id).then(()=>{
          const idx=S.chatMsgs.findIndex(x=>x.id===m.id);
          if(idx>-1){S.chatMsgs[idx].read_at=new Date().toISOString();render();}
        });
      }
    }).subscribe();
}

async function loadFeed(){
  if(!S.session||S.feedLoading)return;
  S.feedLoading=true;render();
  const uid=S.session.user.id,p=S.profile;
  try{
    const[{data:swiped},{data:blocked},{data:reported},{data:unmatched}]=await Promise.all([
      sb.from('discovery_feed_interactions').select('receiver_id').eq('sender_id',uid),
      sb.from('blocked_users').select('blocked_id,blocker_id').or(`blocker_id.eq.${uid},blocked_id.eq.${uid}`),
      sb.from('reported_profiles').select('reported_user_id').eq('reporter_id',uid),
      sb.from('matches').select('user_one,user_two').or(`user_one.eq.${uid},user_two.eq.${uid}`).eq('status','unmatched'),
    ]);
    const exc=new Set([uid]);
    (swiped||[]).forEach(r=>exc.add(r.receiver_id));
    (blocked||[]).forEach(b=>{exc.add(b.blocked_id);exc.add(b.blocker_id);});
    (reported||[]).forEach(r=>exc.add(r.reported_user_id));
    (unmatched||[]).forEach(m=>exc.add(m.user_one===uid?m.user_two:m.user_one));
    const gf=S.cat==='math'?'goal_math':'goal_reading';
    const mg=S.cat==='math'?(p?.goal_math||600):(p?.goal_reading||600);
    const rng=p?.filter_range||40;
    const excA=[...exc];
    let q=sb.from('profiles').select('*').or('is_deleted.is.null,is_deleted.eq.false').not('first_name','is',null).not('grade_level','is',null).gte(gf,mg-rng).lte(gf,mg+rng).limit(25);
    if(S.gradeFilter)q=q.eq('grade_level',S.gradeFilter);
    if(excA.length)q=q.not('id','in',`(${excA.join(',')})`);
    const{data,error}=await q.order('created_at',{ascending:false});
    if(error)throw error;
    S.feed=data||[];S.fi=0;
    const{data:bk}=await sb.from('bookmarked_profiles').select('bookmarked_user_id').eq('user_id',uid);
    S.bookmarks=new Set((bk||[]).map(b=>b.bookmarked_user_id));
  }catch(e){console.error('Feed:',e);}
  S.feedLoading=false;render();
}

async function loadMatches(){
  if(!S.session)return;
  S.matchesLoading=true;render();
  const uid=S.session.user.id;
  try{
    // Add a 10 second timeout so it never hangs forever
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
    const fetch=async()=>{
      const{data,error}=await sb.from('matches').select('id,user_one,user_two,status,created_at').or(`user_one.eq.${uid},user_two.eq.${uid}`).order('created_at',{ascending:false});
      if(error)throw error;
      if(!data?.length){S.matches=[];S.archiveMatches=[];return;}
      const pIds=data.map(m=>m.user_one===uid?m.user_two:m.user_one);
      const{data:profs}=await sb.from('profiles').select('*').in('id',pIds);
      const pm=Object.fromEntries((profs||[]).map(p=>[p.id,p]));
      const msgs=await Promise.all(data.map(m=>sb.from('messages').select('*').eq('match_id',m.id).order('created_at',{ascending:false}).limit(1)));
      const all=data.map((m,i)=>({...m,partner:pm[m.user_one===uid?m.user_two:m.user_one],lastMsg:(msgs[i].data||[])[0]||null}));
      S.matches=all.filter(m=>m.status==='active');
      S.archiveMatches=all.filter(m=>m.status==='unmatched'||m.status==='deleted_user');
    };
    await Promise.race([fetch(),timeout]);
  }catch(e){
    console.error('loadMatches:',e);
    S.matches=S.matches||[];
    S.archiveMatches=S.archiveMatches||[];
  }
  S.matchesLoading=false;
  render(); // always render, even on error
}

}

  await sb.from('reported_profiles').insert({reporter_id:uid,reported_user_id:tid,reason});
  await sb.from('blocked_users').insert({blocker_id:uid,blocked_id:tid,reason:'reported'}).throwOnError().catch(()=>{});

async function pickMedia(e){
  const file=e.target.files?.[0];if(!file)return;e.target.value='';
  const isVid=file.type.startsWith('video/');
  if(!isVid&&!file.type.startsWith('image/')){toast('Images and videos only.');return;}
  if(file.size>50*1024*1024){toast('Max 50MB.');return;}
  const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
  S.mediaPending={file,dataUrl,type:isVid?'video':'image'};updateSendBtn();render();
}

async function deleteAccount(){
  S.showDelConfirm=false;
  const uid=S.session.user.id;

  // Archive all matches for the other user before deleting
  const{error:matchErr}=await sb.from('matches')
    .update({status:'deleted_user',unmatched_by:uid,unmatched_at:new Date().toISOString()})
    .or(`user_one.eq.${uid},user_two.eq.${uid}`);
  if(matchErr)console.error('Match archive failed:',matchErr);

  try{
    const{error:rpcErr}=await sb.rpc('delete_own_account');
    if(rpcErr)throw rpcErr;
  }catch(e){
    console.error('delete_own_account RPC failed:',e);
    // Don't hard-delete the profile here — that would trigger the FK
    // cascade on matches and wipe out the archive we just set above.
    // Just log it so we can see what actually broke.
    toast('Something went wrong deleting your account. Please contact support.');
    render();
    return;
  }

  await sb.auth.signOut();
  S.session=null;S.profile=null;S.feed=[];S.matches=[];

/* ── SAT OCR — Multi-PDF + Identity Verification */
async function handlePDF(file){
  if(!file)return;
  const p=S.profile||S.of;
  S.scanLoading=true;S.scanErr='';S.scanOk='';render();
  try{
    const base64=await toBase64(file);
    const mediaType=file.type||'image/jpeg';
    const resp=await fetch(SB_URL+'/functions/v1/scan_sat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON},
      body:JSON.stringify({
        base64,mediaType,
        firstName:(p.first_name||p.first||'').trim(),
        lastInitial:(p.last_initial||(p.last||'').charAt(0)||'').trim()
      })
    });
    let result;
    try{result=await resp.json();}
    catch(je){S.scanErr='Unexpected response from scanner. Try again.';S.scanLoading=false;render();return;}
    if(!resp.ok||result.error){
      const err=result.error||'';
      if(err==='NAME_MISMATCH')S.scanErr='Verification failed: name on report does not match your profile.';
      else if(resp.status===404)S.scanErr='Scanner not set up. Deploy the scan_sat Edge Function in Supabase.';
      else if(err.includes('credit')||err.includes('billing'))S.scanErr='Scanner out of credits. Contact the app administrator.';
      else S.scanErr='Scanner error: '+err;
      S.scanLoading=false;render();return;
    }
    const math=result.math&&result.math>=200&&result.math<=800?Math.round(result.math/10)*10:null;
    const reading=result.reading&&result.reading>=200&&result.reading<=800?Math.round(result.reading/10)*10:null;
    if(!math||!reading){
      S.scanErr='Could not extract valid scores. Make sure it is an official College Board SAT score report.';
      S.scanLoading=false;render();return;
    }
    if(S.session){
      await sb.from('sat_score_submissions').insert({
        user_id:S.session.user.id,math_score:math,reading_score:reading,
        file_name:file.name,verified:true
      });
      const{data:up}=await sb.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle();
      if(up){
        S.profile=up;
        if(S.sf){S.sf.curMath=up.current_math;S.sf.curRead=up.current_reading;S.sf.hasSat=true;}
      }
    }
    S.of.curMath=math;S.of.curRead=reading;S.of.hasSat=true;
    await loadUploads();
    S.scanOk='✓ Score verified — Math '+math+', Reading '+reading+' (superscore updated)';
  }catch(e){
    console.error('Scan:',e);
    if(e.message&&e.message.includes('fetch'))
      S.scanErr='Could not reach the scanner. Check your internet connection.';
    else
      S.scanErr='Unexpected error. Please try again.';
  }
  S.scanLoading=false;render();
}

/* ── NAVIGATION */
async function gotoTab(tab){
  S.tab=tab;S.openChat=null;
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  const nb=$('nb-'+tab);if(nb)nb.classList.add('on');
  if(tab==='matches'){
      loadMatches();
      // Mark all matches as "read up to now" when opening the tab
      // This prevents refresh from showing old messages as unread
      const now=new Date().toISOString();
      if(S.matches&&S.matches.length){
        S.matches.forEach(m=>{if(!S.lastRead[m.id])S.lastRead[m.id]=now;});
        try{localStorage.setItem('pp_lastread',JSON.stringify(S.lastRead));}catch(e){}
      }
      loadUnreadCount();
    }
  if(tab==='discover'&&!S.feed.length)loadFeed();
  if(tab==='profile'&&S.profile){
    S.sf={grade:String(S.profile.grade_level||11),bio:S.profile.bio||'',
      goalMath:S.profile.goal_math||600,goalReading:S.profile.goal_reading||600,
      hasSat:!!S.profile.has_taken_sat,curMath:S.profile.current_math||null,
      curRead:S.profile.current_reading||null,range:S.profile.filter_range||40,
      notif:!!S.profile.email_notifications_enabled,
      avUrl:S.profile.avatar_url||AVATARS[0].url,
      strengths:[...(S.profile.strengths||[])],
      weaknesses:[...(S.profile.weaknesses||[])],
      gradeFilter:S.gradeFilter||null};
    await loadUploads();
    // If uploads exist, ensure hasSat is true so they show
    if(S.uploads.length>0&&S.sf){
      S.sf.hasSat=true;
      S.sf.curMath=S.profile.current_math||S.sf.curMath;
      S.sf.curRead=S.profile.current_reading||S.sf.curRead;
    }
    render(); // render AFTER uploads loaded
    return;   // skip the render() below
  }
  render();
}

async function initApp(){
  if(!S.session)return;
  const app=$('app');
  if(app)app.innerHTML='<div class="loading-s"><div class="spinner"></div><p>Loading…</p></div>';

  // Restore last-read timestamps
  try{const stored=localStorage.getItem('pp_lastread');if(stored)S.lastRead=JSON.parse(stored);}catch(e){S.lastRead={};}

  let prof=null,att=0;
  while(att<3){
    try{
      const{data,error}=await sb.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle();
      if(error&&error.code!=='PGRST116')throw error;
      prof=data||null;break;
    }catch(e){att++;if(att<3)await new Promise(r=>setTimeout(r,1000*att));}
  }

  // Profile is complete if the user has ANYTHING filled in beyond defaults.
  // We deliberately cast a wide net — if they have a first_name they've
  // at minimum started onboarding, and we skip straight to discover.
  const hasName = prof && prof.first_name && prof.first_name.trim().length > 0;
  const hasAvatar = prof && prof.avatar_url && prof.avatar_url.length > 0;
  const hasStrengths = prof && prof.strengths && prof.strengths.length > 0;
  const hasWeaknesses = prof && prof.weaknesses && prof.weaknesses.length > 0;
  const hasBio = prof && prof.bio && prof.bio.trim().length > 0;
  const hasCustomGoals = prof && (prof.goal_math !== 600 || prof.goal_reading !== 600);
  if(prof && prof.is_deleted){
    S.showAccountDeleted=true;
    await sb.auth.signOut();
    S.session=null;
    render();
    return;
  }

  const hasConsent = prof && prof.consent_display_name === true;

  const isComplete = prof && hasConsent;

  if(isComplete){
    S.profile=prof;
    $('nav').style.display='flex';
    subMatches();
    await Promise.all([loadFeed(), loadUploads()]); // load both in parallel
    // If user has uploads, ensure profile reflects has_taken_sat
    if(S.uploads.length>0&&S.profile&&!S.profile.has_taken_sat){
      S.profile.has_taken_sat=true;
    }
    gotoTab('discover');
    await loadUnreadCount();
    setInterval(async()=>{await loadUnreadCount();},30000);
    registerPush();
  }else if(!prof&&att>=3){
    // Network error — show retry screen
    if(app)app.innerHTML='<div class="vgate"><div class="vgate-icon">⚠️</div><h2>Connection Error</h2><p>Could not load your profile. Check your connection and try again.</p><button class="btn-p" onclick="initApp()" style="margin-top:16px">Retry</button><button class="so-btn" onclick="signOut()" style="margin-top:8px">Sign Out</button></div>';
  }else{
    // Genuinely new user — send to onboarding
    if(prof){S.of.first=prof.first_name||S.of.first;S.of.last=prof.last_initial||S.of.last;}
    S.obStep=1;render();
  }
}

  if(S.showRecovery){app.innerHTML=rRecoveryScreen();return;}
  if(!S.session){app.innerHTML=S.showVerify?rVerifyGate():rAuth();return;}
  if(!S.profile){app.innerHTML=rOnboard();return;}
  const scrollEl=app.querySelector('.profs')||app.querySelector('.ob')||app.querySelector('.mlist')||app.querySelector('.cmsgs');
  const savedScroll=scrollEl?scrollEl.scrollTop:0;const savedClass=scrollEl?(scrollEl.className.split(' ')[0]):null;
  let html='';
  if(S.tab==='discover')html=rDiscover();
  else if(S.tab==='matches')html=S.openChat?rChat():rMatchList();
  else if(S.tab==='profile')html=rProfile();
  if(S.showMM&&S.pendingPt)html+=rMatchModal();
  if(S.showReport)html+=rReportModal();
  if(S.showUnmatch)html+=rUnmatchConfirm();
  if(S.showDelConfirm)html+=rDelConfirm();
  if(S.showResetPw)html+=rResetPwModal();
  app.innerHTML=html;
  if(savedClass&&savedScroll>0){const el=app.querySelector('.'+savedClass);if(el)el.scrollTop=savedScroll;}
  bindPostRender();
}

/* ── MATCH LIST */
function rMatchList(){
  const uid=S.session?.user.id,isAct=S.subTab==='active';
  const list=isAct?S.matches:S.archiveMatches;
  const inner=S.matchesLoading?`<div class="loading-s"><div class="spinner"></div><p>Loading…</p></div>`:
  !list.length?`<div class="empty-s">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <h3>${isAct?'No matches yet':'Archive is empty'}</h3>
    <p>${isAct?'When you and another student both heart each other, you can chat here.':'Unmatched conversations appear here.'}</p>
  </div>`:
  list.map(m=>{
    const p=m.partner,name=p?`${esc(p.first_name)} ${esc(p.last_initial)}.`:'Study Partner';
    const rawLm=m.lastMsg?m.lastMsg.message_text:'';
    const lm=rawLm.startsWith('[IMAGE]')?'📷 Photo':rawLm.startsWith('[VIDEO]')?'🎬 Video':rawLm?esc(rawLm):'Tap to start studying!';
    const t=relTime(m.lastMsg?.created_at||m.created_at),arch=m.status==='unmatched'||m.status==='deleted_user';
    const pJ=JSON.stringify(p||{}).replace(/"/g,'&quot;');
    return `<div class="mrow" onclick="openChatView('${m.id}',${pJ},${arch},'${m.status||""}')">
      <div class="mav-wrap">
        <div class="mav">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="" loading="lazy"/>`:initials(p)}</div>
        ${(S.unreadPerMatch&&S.unreadPerMatch[m.id])?`<span class="mav-badge">${S.unreadPerMatch[m.id]>99?'99+':String(S.unreadPerMatch[m.id])}</span>`:''}
      </div>
      <div class="minf"><div class="mname">${name}</div><div class="mmsg">${lm}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="mtime">${t}</span>${arch?'<span class="arch-badge">Archived</span>':''}

  }).join('');

  return `

    <button class="mst ${S.subTab==='active'?'on':''}" onclick="S.subTab='active';render()">Active</button>
    <button class="mst ${S.subTab==='archive'?'arch-on':''}" onclick="S.subTab='archive';render()">Archive</button>
  </div>
  <div class="mlist">${inner}</div>`;
}

/* ── CHAT */
function rChat(){
  const{openChat:ch,chatMsgs:msgs,chatLoading,session,chatArchived:arch}=S;
  if(!ch||!session)return '';
  const p=ch.partner,uid=session.user.id;
  const name=p?`${esc(p.first_name)} ${esc(p.last_initial)}.`:'Study Partner';
  const msgsHtml=chatLoading?`<div class="loading-s"><div class="spinner"></div></div>`:
  msgs.length===0?`<div class="sys-msg" style="margin-top:auto">${S.openChat?.match?.status==='deleted_user'?'This user has deleted their account.':arch?'This conversation is archived.':'Matched! Send a message to start studying 👋'}</div>`:
  `<div class="sys-msg">${arch?'Archived conversation':'You matched — let\'s study!'}</div>`+
  msgs.map(m=>{
    const out=m.sender_id===uid;
    const txt=m.message_text||'';
    let body='';
    if(txt.startsWith('[IMAGE]')){
      const src=esc(txt.slice(7));
      body=`<img src="${src}" style="max-width:210px;border-radius:12px;display:block;cursor:pointer;margin-top:3px" onclick="S.showLightbox=true;S.lightboxSrc='${src}';S.lightboxType='image';render()" loading="lazy"/>`;
    }else if(txt.startsWith('[VIDEO]')){
      const src=esc(txt.slice(7));
      body=`<video src="${src}" style="max-width:220px;border-radius:12px;display:block;margin-top:3px" controls playsinline></video>`;
    }else{
      body=esc(txt);
    }
    const isLast=msgs.indexOf(m)===msgs.length-1;
    let status='';
    if(out){
      if(m.read_at) status='<span class="msg-status">✓✓ Read</span>';
      else status='<span class="msg-status">✓ Delivered</span>';
    }
    return `<div class="msg ${out?'msg-out':'msg-in'}">${body}<div class="msg-t">${shortTime(m.created_at)}${out&&isLast?status:''}</div></div>`;
  }).join('');

  return `
  <div class="chdr">
    <button class="back-btn" onclick="S.openChat=null;render()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="chdr-av">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="" loading="lazy"/>`:initials(p)}</div>
    <div style="min-width:0">
      <div class="chdr-name">${name}</div>
      ${S.openChat?.match?.status==='deleted_user'?'<div class="chdr-sub arch">User deleted account</div>':arch?'<div class="chdr-sub arch">Archived</div>':''}
    </div>
    ${!arch?`<button class="chdr-unmatch" onclick="S.unmatchId='${ch.matchId}';S.showUnmatch=true;render()">Unmatch</button>`:''}
  </div>
  ${arch?`<div class="arch-banner"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>You or the other person has unmatched or deleted his/her account. This conversation is read-only.</span></div>`:''}
  <div class="cmsgs" id="cmsgs">${msgsHtml}</div>
  ${!arch?`
  ${S.mediaPending?`<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--navy-s);border-top:1px solid var(--navy-b);font-size:12.5px;color:var(--navy2);flex-shrink:0">
    ${S.mediaPending.type==='image'?`<img src="${S.mediaPending.dataUrl}" style="width:38px;height:38px;border-radius:7px;object-fit:cover"/>`:
    `<video src="${S.mediaPending.dataUrl}" style="width:38px;height:38px;border-radius:7px;object-fit:cover"></video>`}
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc(S.mediaPending.file.name)}</span>
    <button onclick="S.mediaPending=null;updateSendBtn();render()" style="background:none;border:none;color:var(--navy2);cursor:pointer;font-size:20px;line-height:1;padding:0 4px">×</button>
  </div>`:''}
  <div class="cinp-bar">
    <input type="file" id="mfin" style="display:none" accept="image/*,video/*" onchange="pickMedia(event)"/>
    <button onclick="document.getElementById('mfin').click()" title="Send photo or video" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--bdr);background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
      <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:var(--t2);stroke-width:1.8;fill:none"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input class="cinp" id="cinp" type="text" placeholder="${S.mediaPending?'Add a caption…':'Message…'}" oninput="S.chatInput=this.value;updateSendBtn()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}" onfocus="scrollChat()" value="${esc(S.chatInput)}"/>
    <button class="csend" id="csend-btn" onclick="sendMsg()" ${!S.chatInput.trim()&&!S.mediaPending?'disabled':''}>
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>`:''}`;
}

async function loadUnreadCount(){
  if(!S.session)return;
  const uid=S.session.user.id;
  try{
    const{data:myMatches}=await sb.from('matches').select('id')
      .or('user_one.eq.'+uid+',user_two.eq.'+uid).eq('status','active');
    if(!myMatches?.length){S.unreadCount=0;S.unreadPerMatch={};return;}
    const mids=myMatches.map(m=>m.id);
    const now=new Date().toISOString();
    const results=await Promise.all(mids.map(mid=>
      sb.from('messages').select('match_id',{count:'exact',head:true})
        .eq('match_id',mid).neq('sender_id',uid)
        .gt('created_at',S.lastRead[mid]||(()=>{S.lastRead[mid]=now;try{localStorage.setItem('pp_lastread',JSON.stringify(S.lastRead));}catch(e){}return now;})())
    ));
    const pm={};
    mids.forEach((mid,i)=>{
      if(results[i].count>0){
        pm[mid]=results[i].count;
      }else{
        // No unread for this match — update lastRead to now
        // so after a refresh, we don't re-count old messages
        if(!S.lastRead[mid])S.lastRead[mid]=now;
      }
    });
    S.unreadPerMatch=pm;
    S.unreadCount=Object.values(pm).reduce((a,b)=>a+b,0);
    // Persist lastRead so refresh doesn't reset unread state
    try{localStorage.setItem('pp_lastread',JSON.stringify(S.lastRead));}catch(e){}
  }catch(e){
    console.error('unread:',e);
    S.unreadCount=0;S.unreadPerMatch={};
  }
  // Re-render match list so badges appear immediately
  if(S.tab==='matches'&&!S.openChat)render();
}

/* ── BOOTSTRAP */
// JS backup for rotate detection (some browsers handle orientation CSS inconsistently)
function checkOrientation(){
  const overlay=document.getElementById('rotate-overlay');
  const root=document.getElementById('root');
  if(!overlay||!root)return;
  const isLandscape=window.innerWidth>window.innerHeight;
  // pointer:coarse = touch device (iPad/iPhone), pointer:fine = mouse (laptop/desktop)
  const isTouch=window.matchMedia('(pointer:coarse)').matches;
  // All iPad landscape heights max out at 1032px (iPad Pro 13")
  // Desktop monitors are 1080px+ tall
  const isTabletHeight=window.innerHeight<=1079;
  const shouldRotate=isLandscape&&isTouch&&isTabletHeight;
  if(shouldRotate){
    overlay.style.display='flex';
    root.style.display='none';
  }else{
    overlay.style.display='';
    root.style.display='';
  }
}
window.addEventListener('resize',checkOrientation);
window.addEventListener('orientationchange',()=>setTimeout(checkOrientation,100));
checkOrientation();

// ── KEYBOARD FIX — prevent iOS from shifting the whole page up when
// the on-screen keyboard opens. We track the real visible height via
// visualViewport and feed it into a CSS variable that .phone uses,
// so the actual app frame shrinks correctly (nav + input bar dock
// right above the keyboard) instead of the OS translating the page.
function setupKeyboardFix(){
  if(!window.visualViewport)return;
  function onVVChange(){
    document.documentElement.style.setProperty('--app-height',window.visualViewport.height+'px');
    if(window.scrollY!==0)window.scrollTo(0,0);
    if(S.openChat)scrollChat();
  }
  window.visualViewport.addEventListener('resize',onVVChange);
  window.visualViewport.addEventListener('scroll',onVVChange);
  onVVChange();
}

(async()=>{
  setupKeyboardFix();
  setInterval(updateClock,30000);
  S.authErr=null;
  // If arriving from an email confirmation link, go to onboarding
  const hashParams=new URLSearchParams(window.location.hash.replace('#',''));
  const queryParams=new URLSearchParams(window.location.search);
  const recTokenHash=queryParams.get('token_hash');
  const recType=queryParams.get('type');
  if(recTokenHash&&recType==='recovery'){
    window.history.replaceState(null,'',window.location.pathname);
    const{data,error}=await sb.auth.verifyOtp({token_hash:recTokenHash,type:'recovery'});
    if(error){
      alert('This password reset link has expired or already been used. Please contact support for a new one.');
    }
    // Always stop here regardless of outcome — never fall through to initApp
    S.session=data?.session||null;
    S.showRecovery=!!data?.session;
    render();
    return;
  }
  const isRecovery=
    hashParams.get('type')==='recovery'||
    queryParams.get('type')==='recovery'||
    hashParams.has('access_token')&&hashParams.get('type')!=='signup';
  if(isRecovery){
    window.history.replaceState(null,'',window.location.pathname);
    const{data:{session:recSess}}=await sb.auth.getSession();
    if(recSess){
      S.session=recSess;
      S.showRecovery=true;
      render();
      return;
    }
  }
  const isEmailConfirm=
    hashParams.get('type')==='signup'||
    hashParams.get('type')==='email_confirmation'||
    queryParams.get('type')==='signup'||
    queryParams.get('type')==='email_confirmation'||
    queryParams.has('code');
  if(isEmailConfirm){
    window.history.replaceState(null,'',window.location.pathname);
    await sb.auth.signOut();
    S.session=null;
    S.authErr=null;
    S.showVerified=true;
    render();
    return;
  }

  const{data:{session}}=await sb.auth.getSession();
  S.session=session;
  sb.auth.onAuthStateChange((_e,sess)=>{
    S.session=sess;
    if(!sess){
      S.profile=null;
      S.obStep=1;
      $('nav').style.display='none';
      render();
    }
  });
  if(session){
    const{data:{user},error}=await sb.auth.getUser();
    if(error||!user){
      await sb.auth.signOut();
      S.session=null;
      render();
    }else{
      await initApp();
    }
  }else{
    render();
  }
})();
</script>
